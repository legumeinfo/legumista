name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        fastmcp: ["fastmcp>=3.0,<4", "fastmcp>=4,<5"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # DSCensor is not on PyPI yet; without it the catalog-backed tests skip (-rs lists them).
      - name: Check out DSCensor (legumista-interop branch)
        uses: actions/checkout@v4
        with:
          repository: legumeinfo/microservices
          ref: legumista-interop
          path: _deps/microservices

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pyyaml "${{ matrix.fastmcp }}"

      - name: Test (offline; conftest blocks the network)
        env:
          LEGUMISTA_DSCENSOR_PATH: ${{ github.workspace }}/_deps/microservices/dscensor
        run: python -m pytest -q -rs
