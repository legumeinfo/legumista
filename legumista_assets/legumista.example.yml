# ==========================================================================
# legumista.example.yml — copy to legumista.yml and edit for YOUR research topic.
# ==========================================================================
# This is the only file (plus the data files noted below) you must change to
# re-point the whole discovery -> synthesis -> ideation pipeline at a new field.
# Anything omitted here falls back to the built-in defaults in config.py.
#
# To start a new topic (via `legumista init`):
#   1. `legumista init ~/topics/mytopic` — scaffolds the bare config: this file as
#      legumista.yml plus an empty agent_state.json. (No copying the repo.)
#   2. Edit legumista.yml (identity below).
#   3. Put 3-15 VERIFIED anchor DOIs for your field in agent_state.json
#      (both anchor_dois and pending_dois; never invent DOIs).
#   4. (Optional) add context_inputs/*.md (scope + ranking rules, re-read every loop).
#   5. (Optional) add ideation-goal.md (what Phase 3 should discover).
#   6. (Optional) drop a prompts/<name>.md to override one phase's wording, or a
#      system-prompt.md here to override the packaged default persona/rules.
#   7. Set the llm endpoint below to your model, then run `legumista discover`.
# Steps 4-6 are optional — the pipeline inherits packaged/empty defaults without them.
# Output dirs (papers/, reviews/, corpus/, ideas/) are created on the first run.
# See PIPELINE.md for the full walkthrough, and examples/lupinus/ for a worked project.
# --------------------------------------------------------------------------

name: CRISPR base editing                 # human-readable project name
slug: crispr-base-editing                 # kebab-case: report titles + filenames
subject: CRISPR base and prime editing in mammalian cells   # noun phrase for prompts
# 1-3 sentences; the crawl's guardrail:
scope: >-
  CRISPR base editors and prime editors in mammalian systems: editor
  architectures, guide/pegRNA design, on-/off-target profiling, delivery, and
  therapeutic applications.

years: [2015, 2026]                        # inclusive scope window
contact_email: you@example.org            # OpenAlex/Unpaywall polite-pool mailto

# Phase-1 lexical pre-ranking: `strong` (weighted 5x) are the unmistakable on-topic
# terms; `weak` (1x) are supporting field vocabulary. Keep these tight — they exist
# to stop generic method papers from crowding out real on-topic work.
lexical:
  strong: [base editor, prime editor, crispr]
  weak:
    - cytosine
    - adenine
    - deaminase
    - cas9
    - cas12
    - pegrna
    - sgrna
    - off-target
    - bystander
    - editing window
    - nickase
    - reverse transcriptase
    - delivery
    - AAV
    - lipid nanoparticle

ideation:
  # The kind of ideas Phase 3 should generate. For a dry/computational field keep the
  # default below; for a lab science you might write e.g.:
  #   "experimentally testable hypotheses feasible in a standard molecular-biology lab"
  domain_constraint: purely computational / bioinformatic (no wet-lab, no new data generation)

# LLM endpoint (OpenAI-compatible /chat/completions). Default = OpenRouter + a free
# ~3B model for a zero-setup demo: set OPENROUTER_API_KEY and go. For real runs,
# point at LOCAL OLLAMA instead (no proxy, no key) by uncommenting the ollama block.
llm:
  base_url: https://openrouter.ai/api/v1
  model: meta-llama/llama-3.2-3b-instruct:free   # free 3B; browse others at openrouter.ai/models
  small_model: ""                                # optional lighter model; blank = use `model`
  api_key_env: OPENROUTER_API_KEY                # export this env var with your key
  temperature: 0.3
  max_tokens: 0                                  # 0 = provider default
  timeout: 3600                                  # seconds; large-corpus synthesis can be slow
  json_mode: false                               # true => request response_format json_object
  # headers: { HTTP-Referer: "https://your.site", X-Title: legumista }  # optional (OpenRouter)

# --- Local ollama instead of OpenRouter (uncomment; no proxy, no API key needed):
# llm:
#   base_url: http://localhost:11434/v1
#   model: qwen3:32b                # your `ollama list` tag
#   api_key_env: OLLAMA_API_KEY     # unused by ollama; leave unset
#   timeout: 3600

# Agentic tool-loop settings. Every phase runs its model step as a bounded tool-loop;
# max_turns caps how many tool round-trips a single step may take before it must answer.
# (Env override: LEGUMISTA_AGENT_MAX_TURNS.)
# agent:
#   max_turns: 8                    # default 8
