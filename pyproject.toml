[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "legumista"
version = "0.1.2"
description = "Autonomous research discovery → synthesis → ideation pipeline driven by any OpenAI-compatible LLM."
readme = "README.md"
requires-python = ">=3.11"          # 3.11+ baseline (stdlib features used across the pipeline)
license = "MIT"                     # SPDX expression; full text in LICENSE
authors = [{name = "Matt Wiese"}]
keywords = [
    "research", "literature-review", "citation-graph",
    "llm", "openalex", "agent",
]
classifiers = [
    # NOTE: no "License :: OSI Approved :: MIT License" classifier — PEP 639
    # forbids pairing a license classifier with the SPDX `license` expression
    # above (newer setuptools errors out). The SPDX expression is canonical.
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "typer>=0.12",   # <0.12 breaks with Click >=8.2 help rendering
    "PyYAML>=6",     # parse the project config (legumista.yml)
    "ddgs>=6",       # keyless web search (web_search native tool)
    "pypdf>=4",      # OA full-text extraction (read_paper native tool)
]

[project.urls]
Homepage = "https://github.com/legumeinfo/legumista"
Repository = "https://github.com/legumeinfo/legumista"
Issues = "https://github.com/legumeinfo/legumista/issues"

# The paper/OpenAlex/grep/read tools are stdlib — no extra deps. The `ncbi_datasets`
# and `edirect` tools shell out to the NCBI `datasets` / EDirect CLIs if installed
# (optional; the tools report cleanly when absent). `mcp` is only needed to plug in
# external MCP servers (see .mcp.json); install with `.[mcp]`.
[project.optional-dependencies]
mcp = ["mcp>=1.0"]
# `legumista mcp` serves the native toolset over the Model Context Protocol via FastMCP.
serve = ["fastmcp>=2.9"]
# The bioinformatics tools (fasta/bam/vcf/tabix inspection) bind htslib via pysam. The
# tools report cleanly when it's absent, so it's optional; install with `.[bio]`.
bio = ["pysam>=0.22"]

[project.scripts]
legumista = "legumista_cli:main"

# Flat layout: all importable modules live at the repo root and install as
# py-modules; the bundled default prompts + example config ship in the legumista_assets
# package (package-data) so a NON-editable `pip install .` works too. Project data
# (legumista.yml, ledgers, prompts overrides) lives in each project directory, found
# at runtime via config.py (cwd / -C / $LEGUMISTA_HOME) — see PIPELINE.md.
[tool.setuptools]
py-modules = [
    "legumista_cli", "config", "llm", "orchestrator", "ideation",
    "build_digest", "build_ideation_report", "expand_ideas",
    "merge_corpora",
]
packages = ["legumista_assets", "legumista_agent"]

[tool.setuptools.package-data]
legumista_assets = ["prompts/*.md", "legumista.example.yml", "system-prompt.md", "ideation-goal.md"]
