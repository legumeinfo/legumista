[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "legumista"
version = "0.1.4"
description = "An MCP server for legume genomics: the LIS Data Store catalog, InterMine queries, scholarly literature, NCBI, and samtools/bcftools."
readme = "README.md"
requires-python = ">=3.11"          # 3.11+ baseline (tomllib, stdlib typing features)
license = "MIT"                     # SPDX expression; full text in LICENSE
authors = [{name = "Matt Wiese"}]
keywords = [
    "mcp", "model-context-protocol", "bioinformatics", "genomics",
    "legume", "intermine", "openalex", "samtools",
]
classifiers = [
    # NOTE: no "License :: OSI Approved :: MIT License" classifier — PEP 639
    # forbids pairing a license classifier with the SPDX `license` expression
    # above (newer setuptools errors out). The SPDX expression is canonical.
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
# `pip install legumista` gives the whole server. The LIS, literature, InterMine and
# OpenAlex tools are stdlib-only; the `ncbi_datasets`/`edirect` tools shell out to the
# NCBI CLIs if installed (optional — they report cleanly when absent).
dependencies = [
    "typer>=0.12",     # <0.12 breaks with Click >=8.2 help rendering
    "ddgs>=6",         # keyless web search (web_search tool)
    "pypdf>=4",        # OA full-text extraction (read_paper tool)
    "fastmcp>=2.9",    # the `legumista mcp` server itself
    "pysam>=0.22",     # htslib bindings for the samtools/bcftools/tabix tools
    "certifi>=2023.7", # CA bundle for htslib's vendored libcurl (remote genomics I/O)
]

[project.urls]
Homepage = "https://github.com/legumeinfo/legumista"
Repository = "https://github.com/legumeinfo/legumista"
Issues = "https://github.com/legumeinfo/legumista/issues"

[project.scripts]
# `legumista mcp` starts the server. `mcp` is kept as a subcommand rather than collapsed
# into a bare `legumista` because it is what every published client config and the
# container ENTRYPOINT already invoke.
legumista = "legumista_cli:main"

# Flat layout: legumista_cli and config live at the repo root and install as py-modules;
# the tool implementations are the legumista_agent package, and the served instructions
# (prompts/tools_native.md) ship as package data so a NON-editable `pip install .` works.
[tool.setuptools]
py-modules = ["legumista_cli", "config"]
packages = ["legumista_assets", "legumista_agent"]

[tool.setuptools.package-data]
legumista_assets = ["prompts/*.md", "legumista.png"]
